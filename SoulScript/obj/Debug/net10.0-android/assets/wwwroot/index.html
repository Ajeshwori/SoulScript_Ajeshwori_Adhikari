<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>SoulScript</title>
    <base href="/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="SoulScript.styles.css" />
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link rel="icon" href="data:,">
</head>
<body>
    <div class="status-bar-safe-area"></div>
    <div id="app">Loading...</div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script src="js/editor.js"></script> 
    <!-- Editor functions -->
    <script>
        console.log("Loading editor functions...");

        window.editorFormat = function (command) {
            console.log("Formatting:", command);
            if (command === "h1" || command === "h2") {
                document.execCommand("formatBlock", false, command);
            } else {
                document.execCommand(command, false, null);
            }
        };

        window.getEditorContent = function () {
            console.log("Getting editor content...");
            const editor = document.getElementById("editor");
            return editor ? editor.innerHTML : "";
        };

        window.setEditorContent = function (content) {
            const editor = document.getElementById("editor");
            if (editor) {
                editor.innerHTML = content;
            }
        };

        console.log("Editor functions loaded!");
    </script>
</body>
</html>
